[project]
name = "accessor-accuracy-model"
version = "0.1.0"
description = "Analytical storage-error model for quantized DOT and GEMV"
requires-python = ">=3.11,<3.15"
dependencies = [
    "matplotlib>=3.10",
    "numpy>=2.2",
    "scipy>=1.15",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["analysis"]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
pythonpath = ["analysis"]
testpaths = ["analysis/tests"]
