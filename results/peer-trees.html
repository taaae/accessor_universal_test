<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Peer trees, IEEE storage formats</title>
<style>
:root{--bg:#fbfbfa;--fg:#1c1c1a;--muted:#6b6b66;--line:#e3e3df;--panel:#fff;
 --green:#1f8a4c;--red:#c0392b;--grey:#9a9a94;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
 font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
header{padding:16px 24px 12px;border-bottom:1px solid var(--line);background:var(--panel);
 position:sticky;top:0;z-index:5}
h1{margin:0;font-size:17px;font-weight:650}
.titlebar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.fam{display:inline-flex;border-bottom:2px solid var(--line)}
button.fambtn{border:0;background:none;color:var(--muted);cursor:pointer;
 padding:4px 14px 7px;font-size:13px;font-weight:650;letter-spacing:.06em;
 margin-bottom:-2px;border-bottom:2px solid transparent}
button.fambtn[aria-selected=true]{color:var(--fg);border-bottom-color:var(--fg)}
.picker{display:flex;flex-direction:column;gap:7px}
.rowsel{display:flex;gap:8px;align-items:center}
.rowsel.off{display:none}
.rowsel .lbl{width:64px;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
button.tab{border:1px solid var(--line);background:var(--panel);color:var(--fg);
 padding:5px 15px;border-radius:999px;cursor:pointer;font-size:13px;font-weight:600}
button.tab[aria-selected=true]{background:var(--fg);color:var(--panel);border-color:var(--fg)}
.key{margin-left:auto;display:flex;gap:14px;color:var(--muted);font-size:12px;align-items:center}
.key i{display:inline-block;width:22px;height:3px;border-radius:2px;margin-right:6px;vertical-align:2px}
main{display:flex;align-items:flex-start}
#scroll{flex:1;overflow:auto;height:calc(100vh - 200px);padding:20px}
aside{width:320px;flex:none;border-left:1px solid var(--line);background:var(--panel);
 height:calc(100vh - 200px);overflow:auto;padding:20px}
aside h2{margin:0 0 2px;font-size:15px}
aside .bits{color:var(--muted);font-size:12px;margin-bottom:14px}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:13px}
dt{color:var(--muted)} dd{margin:0;font-variant-numeric:tabular-nums}
code{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;background:#f1f1ee;padding:1px 5px;border-radius:4px}
.empty{color:var(--muted);font-size:13px}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:650;color:#fff}
.tally{margin:14px 0 0;font-size:12px;color:var(--muted)}
#useful{margin:34px 0 10px;border-top:1px solid var(--line);padding-top:18px;max-width:820px}
#useful h3{margin:0 0 10px;font-size:14px;font-weight:650}
#useful table{border-collapse:collapse;width:100%;font-size:13px}
#useful th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;
 padding:0 12px 6px 0;border-bottom:1px solid var(--line)}
#useful td{padding:5px 12px 5px 0;border-bottom:1px solid var(--line);
 font-variant-numeric:tabular-nums}
#useful tr.item{cursor:pointer}
#useful tr.item:hover td{background:#f1f1ee}
#useful tr.item.sel td{background:#eceae4;font-weight:600}
#useful td.r{color:var(--green);font-weight:650}
#useful .none{color:var(--muted);font-size:13px}
text{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.row{cursor:pointer}
.row:hover rect{stroke:var(--fg);stroke-width:1.6}
.row.sel rect{stroke:var(--fg);stroke-width:2}
.stag{font-size:10.5px;fill:var(--muted)}
</style></head><body>
<header>
  <div class="titlebar">
    <h1>Peer trees, storage formats</h1>
    <div class="fam">
      <button class="fambtn" data-d="fam" data-v="ieee" aria-selected="true">IEEE</button>
      <button class="fambtn" data-d="fam" data-v="lns" aria-selected="false">LNS</button>
    </div>
  </div>
  <div class="picker">
    <div class="rowsel" id="row-scope"><span class="lbl">scope</span>

      <button class="tab" data-d="scope" data-v="best" aria-selected="false">best</button>
      <span class="key">
        <span><i style="background:var(--green)"></i>beats peer, &gt;1.03x</span>

        <span><i style="background:var(--red)"></i>loses to peer, &lt;0.97x</span>

    </div>
    <div class="rowsel" id="row-compute"><span class="lbl">compute</span>

      <button class="tab" data-d="compute" data-v="fp64" aria-selected="false">FP64</button>
    </div>
    <div class="rowsel"><span class="lbl">kernel</span>
      <button class="tab" data-d="kern" data-v="dot" aria-selected="true">DOT</button>
      <button class="tab" data-d="kern" data-v="gemv" aria-selected="false">GEMV</button>
    </div>
  </div>
</header>
<main>
  <div id="scroll"><svg id="svg"></svg><div id="useful"></div></div>
  <aside id="panel"></aside>
</main>

    if(g.chain){
      panel.innerHTML=`<h2>${esc(n.label)}</h2><div class="bits">${n.bits} bits &middot; IEEE peer</div>
        <dl><dt>strategy</dt><dd><code>${esc(n.strat)}</code></dd>
        <dt>layout</dt><dd>${esc(n.lay)}</dd>
        <dt>vs raw FP32</dt><dd>${n.vsraw.toFixed(3)}x</dd>
        <dt>time</dt><dd>${n.ms.toFixed(4)} ms</dd>
        <dt>baseline</dt><dd>${g.rawms.toFixed(4)} ms</dd></dl>`;
      return;
    }
    panel.innerHTML=`<h2>${esc(n.label)}</h2><div class="bits">the root, ${n.bits} bits</div>
      <dl><dt>time</dt><dd>${n.ms.toFixed(4)} ms</dd>
      <dt>kernel</dt><dd>${pick.kern.toUpperCase()}</dd>
      <dt>scope</dt><dd>${pick.scope}</dd></dl>
      <p class="empty" style="margin-top:16px">Nothing is more precise, so every chain ends here.</p>`;
    return;
  }
  const v={green:'beats its peer',grey:'ties its peer',red:'loses to its peer'}[n.verdict];
  panel.innerHTML=`<h2>${esc(n.label)}</h2>
    <div class="bits">${n.bits} bits &middot; ${pick.kern.toUpperCase()} &middot; ${g.chain?'x1 &middot; to FP32':pick.scope+' &middot; to '+pick.compute.toUpperCase()}</div>
    <p><span class="badge" style="background:${C[n.verdict]}">${n.ratio.toFixed(2)}x &middot; ${v}</span></p>
    <dl>
      <dt>strategy</dt><dd><code>${esc(n.strat)}</code></dd>
      <dt>layout</dt><dd>${esc(n.lay)}</dd>
      <dt>peer</dt><dd>${esc(n.peer)}</dd>
      ${n.peerstrat?`<dt>peer strategy</dt><dd><code>${esc(n.peerstrat)}</code></dd>`:''}
      <dt>vs peer</dt><dd>${n.ratio.toFixed(3)}x</dd>
      <dt>vs ${esc(g.rawlabel)}</dt><dd>${n.vsraw.toFixed(3)}x</dd>
      <dt>time</dt><dd>${n.ms.toFixed(4)} ms</dd>
      <dt>baseline</dt><dd>${g.rawms.toFixed(4)} ms</dd>
    </dl>`;
}
document.querySelectorAll('.tab,.fambtn').forEach(b=>b.onclick=()=>{
  pick[b.dataset.d]=b.dataset.v;
  document.querySelectorAll(`[data-d="${b.dataset.d}"]`)
    .forEach(x=>x.setAttribute('aria-selected',x===b));
  if(b.dataset.d==='fam') sel=null;
  chrome(); draw();
});
chrome();
draw();
</script></body></html>
